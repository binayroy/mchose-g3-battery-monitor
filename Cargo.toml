[package]
name = "mchose-g3-battery-monitor"
version = "1.0.0"
edition = "2021"

[dependencies]
hidapi = "2"
tray-icon = "0.19"
notify-rust = "4"

# ---- Windows only ----
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# ---- Linux only ----
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
winres = "0.1.12"